<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor de Tareas{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background: #f5f5f5;
            color: #222;
        }
        nav {
            margin-bottom: 25px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        input, select, button {
            padding: 9px;
            margin: 5px 0 12px;
        }
        button {
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        .message {
            padding: 12px;
            background: #e8f4ff;
            margin-bottom: 15px;
        }
        .result {
            padding: 15px;
            background: #eef8ee;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Gestor de tareas</a>
        <a href="/about/">Acerca del proyecto</a>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
